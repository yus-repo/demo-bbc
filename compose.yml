services:
  app:
    build: .
    container_name: app_service
    restart: unless-stopped
    ports:
      - "1500:8000"
    # volumes:
    #   - ".:/var/www/html"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=demo_app_db
      - DB_USERNAME=root
      - DB_PASSWORD=demopass123
      - SESSION_DRIVER=file
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql_service
    environment:
      MYSQL_DATABASE: demo_app_db
      MYSQL_USER: demo_app_db
      MYSQL_PASSWORD: demopass123
      MYSQL_ROOT_PASSWORD: demopass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:

